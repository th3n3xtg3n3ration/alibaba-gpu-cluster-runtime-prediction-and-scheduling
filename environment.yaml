name: gpu-scheduling
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python
  - python=3.10

  # Core scientific stack
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - joblib>=1.3.0
  - pyarrow>=12.0.0

  # Machine Learning
  - scikit-learn>=1.3.0
  - lightgbm>=4.0.0
  - xgboost>=2.0.0

  # Deep Learning
  - pytorch::pytorch>=2.0.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.15.0

  # Jupyter & Notebook Automation
  - jupyter
  - ipykernel
  - nbformat
  - nbconvert
  - nbclient

  # YAML config & Utilities
  - pyyaml>=6.0.0
  - tqdm>=4.65.0

  # Pip packages
  - pip
  - pip:
      - heapdict>=1.0.1
      - tabulate>=0.9.0